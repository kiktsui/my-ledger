<!DOCTYPE html>
<html lang="zh-HK" data-theme="christmas">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1f4e3d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="冬日理財帳" />
  <title>冬日理財帳 · 離線記帳與月度結算</title>
  <style>
    :root {
      --bg: #f6f2ea;
      --surface: #ffffff;
      --surface-soft: #fbf8f3;
      --text: #1e2923;
      --muted: #5c6b63;
      --border: #e5ddd0;
      --primary: #1f4e3d;
      --primary-text: #ffffff;
      --accent: #b8332a;
      --gold: #c4963a;
      --income: #1b7a4b;
      --expense: #b8332a;
      --shadow: 0 8px 24px rgba(30, 41, 35, 0.06);
      --snow-opacity: 0.45;
    }

    html[data-theme="frost"] {
      --bg: #eef5fa;
      --surface: #ffffff;
      --surface-soft: #f5f9fc;
      --text: #172b3a;
      --muted: #536c7e;
      --border: #d7e5f0;
      --primary: #1d5d8c;
      --primary-text: #ffffff;
      --accent: #2c7fb8;
      --gold: #6baed6;
      --income: #16796f;
      --expense: #c2415a;
      --shadow: 0 8px 24px rgba(23, 43, 58, 0.06);
      --snow-opacity: 0.5;
    }

    html[data-theme="minimal"] {
      --bg: #f4f5f6;
      --surface: #ffffff;
      --surface-soft: #f9fafb;
      --text: #18181b;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #18181b;
      --primary-text: #ffffff;
      --accent: #334155;
      --gold: #94a3b8;
      --income: #15803d;
      --expense: #b91c1c;
      --shadow: 0 6px 18px rgba(15, 23, 42, 0.05);
      --snow-opacity: 0;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang HK", "Noto Sans HK", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: calc(88px + env(safe-area-inset-bottom));
      min-height: 100vh;
    }

    #snow-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: var(--snow-opacity);
    }

    .app-shell {
      position: relative;
      z-index: 2;
      max-width: 720px;
      margin: 0 auto;
      padding: 16px 16px 24px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .brand-title {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.01em;
    }

    .brand-sub {
      margin: 2px 0 0;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .month-picker {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 10px;
      padding: 7px 10px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .stat-box {
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 10px;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 1.02rem;
      font-weight: 800;
      word-break: break-word;
    }

    .income-text { color: var(--income); }
    .expense-text { color: var(--expense); }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .section-title {
      margin: 0;
      font-size: 1rem;
      font-weight: 700;
    }

    .tx-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .tx-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 12px;
      border-radius: 12px;
      background: var(--surface-soft);
      border: 1px solid var(--border);
    }

    .tx-main {
      min-width: 0;
      flex: 1;
    }

    .tx-cat {
      font-weight: 700;
      font-size: 0.92rem;
    }

    .tx-meta {
      font-size: 0.76rem;
      color: var(--muted);
    }

    .tx-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tx-amount {
      font-weight: 800;
      font-size: 0.95rem;
      white-space: nowrap;
    }

    .btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--primary);
      color: var(--primary-text);
      border-color: var(--primary);
    }

    .btn-accent {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .btn-sm {
      padding: 5px 9px;
      font-size: 0.76rem;
      border-radius: 8px;
    }

    .empty-state {
      text-align: center;
      padding: 28px 12px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .bar-row {
      margin-bottom: 10px;
    }

    .bar-head {
      display: flex;
      justify-content: space-between;
      font-size: 0.84rem;
      margin-bottom: 4px;
    }

    .bar-track {
      height: 10px;
      border-radius: 999px;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 999px;
    }

    .badge-stamp {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--gold) 20%, transparent);
      border: 1px solid var(--gold);
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .compare-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.84rem;
    }

    .compare-table th,
    .compare-table td {
      padding: 8px 6px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }

    .compare-table th:last-child,
    .compare-table td:last-child {
      text-align: right;
    }

    .option-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .hidden {
      display: none !important;
    }

    .tabbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 20;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: center;
      gap: 4px;
    }

    .tab-btn {
      background: transparent;
      border: 0;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 600;
      padding: 6px 4px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .tab-btn.is-active {
      color: var(--primary);
      background: var(--surface-soft);
      font-weight: 800;
    }

    .fab-btn {
      width: 46px;
      height: 46px;
      margin: -14px auto 0;
      border-radius: 50%;
      border: 0;
      background: var(--accent);
      color: #ffffff;
      font-size: 1.5rem;
      line-height: 1;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.18);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(15, 23, 42, 0.45);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 12px;
    }

    .modal-panel {
      width: 100%;
      max-width: 520px;
      background: var(--surface);
      border-radius: 18px;
      padding: 18px;
      border: 1px solid var(--border);
    }

    .field {
      margin-bottom: 12px;
    }

    .field label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--muted);
    }

    .field input,
    .field select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-soft);
      color: var(--text);
      font-size: 0.95rem;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 14px;
    }

    .toast {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      background: var(--primary);
      color: var(--primary-text);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      box-shadow: var(--shadow);
    }
  </style>
</head>
<body>
  <canvas id="snow-canvas"></canvas>
  <div id="toast" class="toast hidden"></div>

  <div class="app-shell">
    <header class="topbar">
      <div>
        <h1 id="app-heading" class="brand-title">🎄 冬日理財帳</h1>
        <p id="app-subtitle" class="brand-sub">離線優先 · 本機儲存 · 聖誕冬日主題</p>
      </div>
      <input id="month-filter" type="month" class="month-picker" aria-label="選擇月份" />
    </header>

    <!-- 分頁 1：明細 -->
    <section id="tab-ledger" class="tab-panel">
      <div class="card">
        <div class="summary-grid">
          <div class="stat-box">
            <div class="stat-label">本月收入</div>
            <div id="sum-income" class="stat-value income-text">$0</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">本月支出</div>
            <div id="sum-expense" class="stat-value expense-text">$0</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">本月結餘</div>
            <div id="sum-balance" class="stat-value">$0</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="section-header">
          <h2 class="section-title">收支明細</h2>
          <button id="btn-quick-add" type="button" class="btn btn-primary btn-sm">+ 記一筆</button>
        </div>
        <div id="tx-list" class="tx-list"></div>
      </div>
    </section>

    <!-- 分頁 2：統計 -->
    <section id="tab-stats" class="tab-panel hidden">
      <div class="card">
        <div class="section-header">
          <h2 class="section-title">本月支出分類分佈</h2>
          <span id="stats-total-expense" class="tx-meta"></span>
        </div>
        <div id="category-bars"></div>
      </div>
    </section>

    <!-- 分頁 3：月度結算（大富翁4風格） -->
    <section id="tab-settlement" class="tab-panel hidden">
      <div class="card">
        <span id="settlement-badge" class="badge-stamp">🎩 理財見習生</span>
        <h2 class="section-title">月度財務結算表（上月對比）</h2>
        <p id="settlement-comment" class="brand-sub"></p>
        <table class="compare-table" style="margin-top: 10px;">
          <thead>
            <tr>
              <th>項目</th>
              <th>上月</th>
              <th>本月</th>
              <th>增減</th>
            </tr>
          </thead>
          <tbody id="settlement-rows"></tbody>
        </table>
      </div>

      <div class="card">
        <div class="section-header">
          <h2 class="section-title">資產與負債項目</h2>
          <button id="btn-add-asset" type="button" class="btn btn-primary btn-sm">+ 新增項目</button>
        </div>
        <div id="asset-list" class="tx-list"></div>
      </div>
    </section>

    <!-- 分頁 4：設定 -->
    <section id="tab-settings" class="tab-panel hidden">
      <div class="card">
        <h2 class="section-title">主題與冬日特效</h2>
        <div class="option-row">
          <button type="button" class="btn theme-btn" data-theme="christmas">🎄 溫馨聖誕</button>
          <button type="button" class="btn theme-btn" data-theme="frost">❄️ 冬日初雪</button>
          <button type="button" class="btn theme-btn" data-theme="minimal">⬜ 經典簡約</button>
        </div>
        <div class="option-row" style="margin-top: 12px;">
          <button id="btn-toggle-snow" type="button" class="btn btn-sm">❄️ 飄雪特效：開啟</button>
          <button id="btn-load-demo" type="button" class="btn btn-sm">🎁 載入冬日示範帳目</button>
          <button id="btn-clear-all" type="button" class="btn btn-sm">🗑️ 清空全部資料</button>
        </div>
      </div>
    </section>
  </div>

  <!-- 底部導覽列（5 格：明細、統計、+、結算、設定） -->
  <nav class="tabbar" aria-label="主導覽">
    <button type="button" class="tab-btn is-active" data-tab="ledger">
      <span>📒</span>
      <span>明細</span>
    </button>
    <button type="button" class="tab-btn" data-tab="stats">
      <span>📊</span>
      <span>統計</span>
    </button>
    <button id="fab-open" type="button" class="fab-btn" aria-label="新增收支">+</button>
    <button type="button" class="tab-btn" data-tab="settlement">
      <span>🎩</span>
      <span>結算</span>
    </button>
    <button type="button" class="tab-btn" data-tab="settings">
      <span>⚙️</span>
      <span>設定</span>
    </button>
  </nav>

  <!-- 新增收支彈窗 -->
  <div id="tx-modal" class="modal-backdrop hidden">
    <div class="modal-panel">
      <h2 class="section-title" style="margin-bottom: 12px;">新增收支記錄</h2>
      <form id="tx-form">
        <div class="field">
          <label for="tx-type">類型</label>
          <select id="tx-type">
            <option value="expense">支出</option>
            <option value="income">收入</option>
          </select>
        </div>
        <div class="field">
          <label for="tx-amount">金額</label>
          <input id="tx-amount" type="number" step="0.01" min="0.01" required placeholder="例如 68" />
        </div>
        <div class="field">
          <label for="tx-category">分類</label>
          <select id="tx-category"></select>
        </div>
        <div class="field">
          <label for="tx-date">日期</label>
          <input id="tx-date" type="date" required />
        </div>
        <div class="field">
          <label for="tx-note">備註（可選）</label>
          <input id="tx-note" type="text" placeholder="例如：午餐、地鐵、聖誕禮物" />
        </div>
        <div class="modal-actions">
          <button id="tx-cancel" type="button" class="btn">取消</button>
          <button type="submit" class="btn btn-primary">儲存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 新增資產/負債彈窗 -->
  <div id="asset-modal" class="modal-backdrop hidden">
    <div class="modal-panel">
      <h2 class="section-title" style="margin-bottom: 12px;">新增資產或負債</h2>
      <form id="asset-form">
        <div class="field">
          <label for="asset-kind">類別</label>
          <select id="asset-kind">
            <option value="asset">資產（現金／存款／投資）</option>
            <option value="liability">負債（信用卡／貸款）</option>
          </select>
        </div>
        <div class="field">
          <label for="asset-name">名稱</label>
          <input id="asset-name" type="text" required placeholder="例如：活期存款、信用卡結餘" />
        </div>
        <div class="field">
          <label for="asset-amount">金額</label>
          <input id="asset-amount" type="number" step="0.01" min="0" required placeholder="例如 25000" />
        </div>
        <div class="modal-actions">
          <button id="asset-cancel" type="button" class="btn">取消</button>
          <button type="submit" class="btn btn-primary">儲存</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    (function () {
      const STORAGE_KEY = "winter_ledger_state_v1";
      const EXPENSE_CATS = ["餐飲", "交通", "購物", "🎁 聖誕禮物", "🧣 冬日購物", "居家帳單", "其他支出"];
      const INCOME_CATS = ["人工", "🎄 年終花紅", "🧧 利是/禮物", "投資回報", "其他收入"];

      const THEME_META = {
        christmas: { title: "🎄 冬日理財帳", sub: "離線優先 · 本機儲存 · 溫馨聖誕主題" },
        frost: { title: "❄️ 初雪理財帳", sub: "離線優先 · 本機儲存 · 冬日初雪主題" },
        minimal: { title: "日常理財帳", sub: "離線優先 · 本機儲存 · 經典簡約主題" }
      };

      function getCurrentMonthStr() {
        const now = new Date();
        const m = String(now.getMonth() + 1).padStart(2, "0");
        return `${now.getFullYear()}-${m}`;
      }

      function getTodayStr() {
        const now = new Date();
        const m = String(now.getMonth() + 1).padStart(2, "0");
        const d = String(now.getDate()).padStart(2, "0");
        return `${now.getFullYear()}-${m}-${d}`;
      }

      function getPrevMonthStr(ym) {
        const parts = (ym || getCurrentMonthStr()).split("-").map(Number);
        let y = parts[0] || new Date().getFullYear();
        let m = (parts[1] || 1) - 1;
        if (m < 1) {
          m = 12;
          y -= 1;
        }
        return `${y}-${String(m).padStart(2, "0")}`;
      }

      function defaultState() {
        return {
          theme: "christmas",
          snowEnabled: true,
          activeTab: "ledger",
          selectedMonth: getCurrentMonthStr(),
          transactions: [],
          assets: [
            { id: "a-cash", kind: "asset", name: "銀行存款", amount: 50000 }
          ]
        };
      }

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return defaultState();
          const parsed = JSON.parse(raw);
          const base = defaultState();
          return {
            theme: THEME_META[parsed.theme] ? parsed.theme : base.theme,
            snowEnabled: typeof parsed.snowEnabled === "boolean" ? parsed.snowEnabled : base.snowEnabled,
            activeTab: ["ledger", "stats", "settlement", "settings"].includes(parsed.activeTab)
              ? parsed.activeTab
              : base.activeTab,
            selectedMonth: typeof parsed.selectedMonth === "string" && parsed.selectedMonth
              ? parsed.selectedMonth
              : base.selectedMonth,
            transactions: Array.isArray(parsed.transactions) ? parsed.transactions : [],
            assets: Array.isArray(parsed.assets) ? parsed.assets : base.assets
          };
        } catch (_err) {
          return defaultState();
        }
      }

      let state = loadState();
      let toastTimer = null;

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (_err) {
          // 忽略部分受限環境嘅儲存限制
        }
      }

      function showToast(msg) {
        const toastEl = document.getElementById("toast");
        if (!toastEl) return;
        toastEl.textContent = msg;
        toastEl.classList.remove("hidden");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toastEl.classList.add("hidden");
        }, 1800);
      }

      function fmtMoney(num) {
        const n = Number(num) || 0;
        const sign = n < 0 ? "-" : "";
        return sign + "$" + Math.abs(n).toLocaleString("en-US", { maximumFractionDigits: 2 });
      }

      function applyTheme() {
        const themeKey = THEME_META[state.theme] ? state.theme : "christmas";
        state.theme = themeKey;
        document.documentElement.setAttribute("data-theme", themeKey);

        const headingEl = document.getElementById("app-heading");
        const subEl = document.getElementById("app-subtitle");
        const snowBtn = document.getElementById("btn-toggle-snow");

        if (headingEl) headingEl.textContent = THEME_META[themeKey].title;
        if (subEl) subEl.textContent = THEME_META[themeKey].sub;
        if (snowBtn) {
          snowBtn.textContent = state.snowEnabled ? "❄️ 飄雪特效：開啟" : "❄️ 飄雪特效：關閉";
        }

        document.querySelectorAll(".theme-btn").forEach((btn) => {
          const isCurrent = btn.getAttribute("data-theme") === themeKey;
          btn.classList.toggle("btn-primary", isCurrent);
        });
      }

      function switchTab(tabName) {
        const validTabs = ["ledger", "stats", "settlement", "settings"];
        const target = validTabs.includes(tabName) ? tabName : "ledger";
        state.activeTab = target;
        saveState();

        validTabs.forEach((name) => {
          const panel = document.getElementById(`tab-${name}`);
          if (panel) {
            panel.classList.toggle("hidden", name !== target);
          }
        });

        document.querySelectorAll(".tab-btn[data-tab]").forEach((btn) => {
          btn.classList.toggle("is-active", btn.getAttribute("data-tab") === target);
        });

        renderAll();
      }

      function getMonthSummary(monthStr) {
        const list = state.transactions.filter((t) => (t.date || "").startsWith(monthStr));
        let income = 0;
        let expense = 0;
        list.forEach((t) => {
          const amt = Number(t.amount) || 0;
          if (t.type === "income") income += amt;
          else expense += amt;
        });
        return { income, expense, balance: income - expense, list };
      }

      function renderLedger() {
        const monthEl = document.getElementById("month-filter");
        if (monthEl && monthEl.value !== state.selectedMonth) {
          monthEl.value = state.selectedMonth;
        }

        const summary = getMonthSummary(state.selectedMonth);
        const incEl = document.getElementById("sum-income");
        const expEl = document.getElementById("sum-expense");
        const balEl = document.getElementById("sum-balance");
        const listEl = document.getElementById("tx-list");

        if (incEl) incEl.textContent = fmtMoney(summary.income);
        if (expEl) expEl.textContent = fmtMoney(summary.expense);
        if (balEl) {
          balEl.textContent = fmtMoney(summary.balance);
          balEl.className = "stat-value " + (summary.balance >= 0 ? "income-text" : "expense-text");
        }

        if (!listEl) return;
        const sorted = [...summary.list].sort((a, b) => (b.date || "").localeCompare(a.date || ""));
        if (sorted.length === 0) {
          listEl.innerHTML = '<div class="empty-state">本月暫無收支記錄，撳「+」即可新增。</div>';
          return;
        }

        listEl.innerHTML = sorted.map((item) => {
          const isInc = item.type === "income";
          const sign = isInc ? "+" : "-";
          const amtClass = isInc ? "income-text" : "expense-text";
          const noteText = item.note ? ` · ${escapeHtml(item.note)}` : "";
          return `
            <div class="tx-item">
              <div class="tx-main">
                <div class="tx-cat">${escapeHtml(item.category || "其他")}</div>
                <div class="tx-meta">${escapeHtml(item.date || "")}${noteText}</div>
              </div>
              <div class="tx-right">
                <span class="tx-amount ${amtClass}">${sign}${fmtMoney(item.amount)}</span>
                <button type="button" class="btn btn-sm del-tx-btn" data-id="${escapeHtml(item.id)}">刪除</button>
              </div>
            </div>
          `;
        }).join("");
      }

      function renderStats() {
        const summary = getMonthSummary(state.selectedMonth);
        const totalEl = document.getElementById("stats-total-expense");
        const barsEl = document.getElementById("category-bars");
        if (totalEl) totalEl.textContent = `總支出：${fmtMoney(summary.expense)}`;
        if (!barsEl) return;

        const map = new Map();
        summary.list
          .filter((t) => t.type !== "income")
          .forEach((t) => {
            const cat = t.category || "其他支出";
            map.set(cat, (map.get(cat) || 0) + (Number(t.amount) || 0));
          });

        const entries = [...map.entries()].sort((a, b) => b[1] - a[1]);
        if (entries.length === 0 || summary.expense <= 0) {
          barsEl.innerHTML = '<div class="empty-state">本月未有支出資料可統計。</div>';
          return;
        }

        barsEl.innerHTML = entries.map(([cat, amt]) => {
          const pct = Math.min(100, Math.round((amt / summary.expense) * 100));
          return `
            <div class="bar-row">
              <div class="bar-head">
                <span>${escapeHtml(cat)}</span>
                <strong>${fmtMoney(amt)} (${pct}%)</strong>
              </div>
              <div class="bar-track">
                <div class="bar-fill" style="width: ${pct}%;"></div>
              </div>
            </div>
          `;
        }).join("");
      }

      function renderSettlement() {
        const cur = getMonthSummary(state.selectedMonth);
        const prev = getMonthSummary(getPrevMonthStr(state.selectedMonth));

        let totalAssets = 0;
        let totalLiabilities = 0;
        state.assets.forEach((a) => {
          const val = Number(a.amount) || 0;
          if (a.kind === "liability") totalLiabilities += val;
          else totalAssets += val;
        });

        const netWorth = totalAssets - totalLiabilities;
        const prevNetWorth = netWorth - cur.balance + prev.balance;

        const badgeEl = document.getElementById("settlement-badge");
        const commentEl = document.getElementById("settlement-comment");
        const rowsEl = document.getElementById("settlement-rows");

        let badgeText = "🎲 穩健冒險家";
        let commentText = "收支保持平衡，繼續留意每月開支節奏。";
        if (cur.income > 0 && cur.balance / cur.income >= 0.3) {
          badgeText = "🎩 理財大亨";
          commentText = "儲蓄率表現出色，淨資產穩步上升！";
        } else if (cur.balance > 0) {
          badgeText = "🏰 穩健地主";
          commentText = "本月錄得正結餘，資金配置健康。";
        } else if (cur.balance < 0) {
          badgeText = "🧣 節日衝刺玩家";
          commentText = "本月支出高於收入，可檢視非必要消費。";
        }

        if (badgeEl) badgeEl.textContent = badgeText;
        if (commentEl) commentEl.textContent = commentText;

        const rows = [
          { label: "總收入", prevVal: prev.income, curVal: cur.income },
          { label: "總開支", prevVal: prev.expense, curVal: cur.expense },
          { label: "本月結餘", prevVal: prev.balance, curVal: cur.balance },
          { label: "淨資產估算", prevVal: prevNetWorth, curVal: netWorth }
        ];

        if (rowsEl) {
          rowsEl.innerHTML = rows.map((r) => {
            const diff = r.curVal - r.prevVal;
            const sign = diff > 0 ? "+" : "";
            return `
              <tr>
                <td>${escapeHtml(r.label)}</td>
                <td>${fmtMoney(r.prevVal)}</td>
                <td><strong>${fmtMoney(r.curVal)}</strong></td>
                <td>${sign}${fmtMoney(diff)}</td>
              </tr>
            `;
          }).join("");
        }

        const assetListEl = document.getElementById("asset-list");
        if (!assetListEl) return;
        if (state.assets.length === 0) {
          assetListEl.innerHTML = '<div class="empty-state">尚未新增資產或負債項目。</div>';
          return;
        }

        assetListEl.innerHTML = state.assets.map((a) => {
          const isLiab = a.kind === "liability";
          return `
            <div class="tx-item">
              <div class="tx-main">
                <div class="tx-cat">${escapeHtml(a.name)}</div>
                <div class="tx-meta">${isLiab ? "負債" : "資產"}</div>
              </div>
              <div class="tx-right">
                <span class="tx-amount ${isLiab ? "expense-text" : "income-text"}">${isLiab ? "-" : ""}${fmtMoney(a.amount)}</span>
                <button type="button" class="btn btn-sm del-asset-btn" data-id="${escapeHtml(a.id)}">刪除</button>
              </div>
            </div>
          `;
        }).join("");
      }

      function renderAll() {
        applyTheme();
        renderLedger();
        renderStats();
        renderSettlement();
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function populateCategories(type) {
        const selectEl = document.getElementById("tx-category");
        if (!selectEl) return;
        const list = type === "income" ? INCOME_CATS : EXPENSE_CATS;
        selectEl.innerHTML = list.map((c) => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("");
      }

      function openTxModal() {
        const modal = document.getElementById("tx-modal");
        const typeEl = document.getElementById("tx-type");
        const amtEl = document.getElementById("tx-amount");
        const dateEl = document.getElementById("tx-date");
        const noteEl = document.getElementById("tx-note");
        if (typeEl) {
          typeEl.value = "expense";
          populateCategories("expense");
        }
        if (amtEl) amtEl.value = "";
        if (dateEl) dateEl.value = `${state.selectedMonth}-01`.startsWith(getCurrentMonthStr())
          ? getTodayStr()
          : `${state.selectedMonth}-01`;
        if (noteEl) noteEl.value = "";
        if (modal) modal.classList.remove("hidden");
      }

      function closeTxModal() {
        const modal = document.getElementById("tx-modal");
        if (modal) modal.classList.add("hidden");
      }

      function openAssetModal() {
        const modal = document.getElementById("asset-modal");
        const nameEl = document.getElementById("asset-name");
        const amtEl = document.getElementById("asset-amount");
        if (nameEl) nameEl.value = "";
        if (amtEl) amtEl.value = "";
        if (modal) modal.classList.remove("hidden");
      }

      function closeAssetModal() {
        const modal = document.getElementById("asset-modal");
        if (modal) modal.classList.add("hidden");
      }

      function initSnow() {
        const canvas = document.getElementById("snow-canvas");
        if (!canvas || !canvas.getContext) return;
        const ctx = canvas.getContext("2d");
        let flakes = [];

        function resize() {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
          flakes = Array.from({ length: 28 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: 1.5 + Math.random() * 2.5,
            s: 0.4 + Math.random() * 0.9
          }));
        }

        resize();
        window.addEventListener("resize", resize);

        function tick() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          if (state.snowEnabled && state.theme !== "minimal") {
            ctx.fillStyle = "#ffffff";
            flakes.forEach((f) => {
              f.y += f.s;
              if (f.y > canvas.height) {
                f.y = -5;
                f.x = Math.random() * canvas.width;
              }
              ctx.beginPath();
              ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
              ctx.fill();
            });
          }
          requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      }

      function bindEvents() {
        document.querySelectorAll(".tab-btn[data-tab]").forEach((btn) => {
          btn.addEventListener("click", () => switchTab(btn.getAttribute("data-tab")));
        });

        const fabOpen = document.getElementById("fab-open");
        const quickAdd = document.getElementById("btn-quick-add");
        if (fabOpen) fabOpen.addEventListener("click", openTxModal);
        if (quickAdd) quickAdd.addEventListener("click", openTxModal);

        const txCancel = document.getElementById("tx-cancel");
        const txType = document.getElementById("tx-type");
        const txForm = document.getElementById("tx-form");
        if (txCancel) txCancel.addEventListener("click", closeTxModal);
        if (txType) {
          txType.addEventListener("change", () => populateCategories(txType.value));
        }
        if (txForm) {
          txForm.addEventListener("submit", (e) => {
            e.preventDefault();
            const type = document.getElementById("tx-type").value;
            const amount = Number(document.getElementById("tx-amount").value);
            const category = document.getElementById("tx-category").value;
            const date = document.getElementById("tx-date").value;
            const note = document.getElementById("tx-note").value.trim();
            if (!amount || amount <= 0 || !date) return;

            state.transactions.push({
              id: "tx-" + Date.now() + "-" + Math.random().toString(36).slice(2, 6),
              type,
              amount,
              category,
              date,
              note
            });
            state.selectedMonth = date.slice(0, 7);
            saveState();
            closeTxModal();
            renderAll();
            showToast("已新增記錄");
          });
        }

        const addAssetBtn = document.getElementById("btn-add-asset");
        const assetCancel = document.getElementById("asset-cancel");
        const assetForm = document.getElementById("asset-form");
        if (addAssetBtn) addAssetBtn.addEventListener("click", openAssetModal);
        if (assetCancel) assetCancel.addEventListener("click", closeAssetModal);
        if (assetForm) {
          assetForm.addEventListener("submit", (e) => {
            e.preventDefault();
            const kind = document.getElementById("asset-kind").value;
            const name = document.getElementById("asset-name").value.trim();
            const amount = Number(document.getElementById("asset-amount").value);
            if (!name || Number.isNaN(amount) || amount < 0) return;

            state.assets.push({
              id: "as-" + Date.now() + "-" + Math.random().toString(36).slice(2, 6),
              kind,
              name,
              amount
            });
            saveState();
            closeAssetModal();
            renderSettlement();
            showToast("已新增項目");
          });
        }

        const monthFilter = document.getElementById("month-filter");
        if (monthFilter) {
          monthFilter.addEventListener("change", () => {
            if (monthFilter.value) {
              state.selectedMonth = monthFilter.value;
              saveState();
              renderAll();
            }
          });
        }

        document.querySelectorAll(".theme-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            state.theme = btn.getAttribute("data-theme") || "christmas";
            saveState();
            applyTheme();
            showToast("已切換主題");
          });
        });

        const snowBtn = document.getElementById("btn-toggle-snow");
        if (snowBtn) {
          snowBtn.addEventListener("click", () => {
            state.snowEnabled = !state.snowEnabled;
            saveState();
            applyTheme();
          });
        }

        const demoBtn = document.getElementById("btn-load-demo");
        if (demoBtn) {
          demoBtn.addEventListener("click", () => {
            const curM = state.selectedMonth || getCurrentMonthStr();
            const prevM = getPrevMonthStr(curM);
            state.transactions = [
              { id: "d1", type: "income", amount: 24000, category: "人工", date: `${curM}-01`, note: "月薪" },
              { id: "d2", type: "expense", amount: 78, category: "餐飲", date: `${curM}-03`, note: "午餐" },
              { id: "d3", type: "expense", amount: 520, category: "🎁 聖誕禮物", date: `${curM}-05`, note: "朋友交換禮物" },
              { id: "d4", type: "expense", amount: 340, category: "🧣 冬日購物", date: `${curM}-08`, note: "冷衫" },
              { id: "d5", type: "income", amount: 24000, category: "人工", date: `${prevM}-01`, note: "上月月薪" },
              { id: "d6", type: "expense", amount: 3200, category: "居家帳單", date: `${prevM}-12`, note: "水電煤" }
            ];
            state.assets = [
              { id: "da1", kind: "asset", name: "活期存款", amount: 68000 },
              { id: "da2", kind: "asset", name: "ETF 投資", amount: 42000 },
              { id: "da3", kind: "liability", name: "信用卡結餘", amount: 4500 }
            ];
            saveState();
            renderAll();
            showToast("已載入示範帳目");
          });
        }

        const clearBtn = document.getElementById("btn-clear-all");
        if (clearBtn) {
          clearBtn.addEventListener("click", () => {
            state.transactions = [];
            state.assets = [];
            saveState();
            renderAll();
            showToast("已清空資料");
          });
        }

        document.addEventListener("click", (e) => {
          const delTx = e.target.closest(".del-tx-btn");
          if (delTx) {
            const id = delTx.getAttribute("data-id");
            state.transactions = state.transactions.filter((t) => t.id !== id);
            saveState();
            renderAll();
            showToast("已刪除記錄");
            return;
          }

          const delAsset = e.target.closest(".del-asset-btn");
          if (delAsset) {
            const id = delAsset.getAttribute("data-id");
            state.assets = state.assets.filter((a) => a.id !== id);
            saveState();
            renderSettlement();
            showToast("已刪除項目");
          }
        });
      }

      function initApp() {
        bindEvents();
        initSnow();
        switchTab(state.activeTab);
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initApp);
      } else {
        initApp();
      }
    })();
  </script>
</body>
</html>
